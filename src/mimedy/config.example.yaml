# mimedy — example configuration
#
# `mimedy --init-config` copies this file to your config location
# (shown by `mimedy --help`): adapt it to your needs.
#
# Every key is optional: missing keys fall back to the built-in defaults.
#
# Ignored files stay in place (ignore_system_files, then ignore).
# The other files go through these rules (first match wins):
#   1. hidden       -> files whose name starts with '.'
#   2. large_files  -> files bigger than threshold_mb
#   3. extensions   -> exact extension match (cheap, no content analysis)
#   4. mimetypes    -> MIME type detected by Magika from the file content
#   5. fallback     -> Magika content group (Image, Video, Code, Document, ...)

# Leave the files the system keeps in folders where they are: .DS_Store,
# ._* (macOS), Thumbs.db, desktop.ini (Windows), .directory (KDE)...
# The full list is in the README. Set to false to organize them anyway.
ignore_system_files: true

# More files to leave in place, as shell-style patterns matched against the
# whole file name, ignoring case (* = anything, ? = one character).
ignore:
  - "*.part"          # Firefox download in progress
  - "*.crdownload"    # Chrome download in progress
  - "~$*"             # Microsoft Office lock file of an open document

# Destination folder for hidden files (.env, .bashrc, ...)
hidden: "Hidden"

# Large files are moved aside before any content analysis.
# Sizes are in decimal MB (1 MB = 1000 * 1000 bytes), like Finder/Explorer.
large_files:
  threshold_mb: 500  # default: 100
  target_dir: "Large"

# Extension rules: use them for formats Magika cannot know about,
# or when the extension carries more meaning than the content
# (a .blend is "Blender", not just "unknown binary").
extensions:
  # Creative tools
  .blend: "Blender"
  .psd: "Photoshop"
  .kra: "Krita"
  .gd: "Godot"
  .tscn: "Godot"
  # Data files (Magika would otherwise group them under "code" or "text")
  .csv: "Data"
  .json: "Data"
  .yaml: "Data"
  .yml: "Data"
  .toml: "Data"
  # Disk images and installers
  .dmg: "Installers"
  .pkg: "Installers"
  .msi: "Installers"
  .iso: "Disk Images"

# MIME type rules: matched against Magika's detection, so they work
# even when the extension is wrong or missing.
mimetypes:
  # Documents
  application/pdf: "PDF"
  application/epub+zip: "Books"
  application/msword: "Documents"
  application/vnd.openxmlformats-officedocument.wordprocessingml.document: "Documents"
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: "Spreadsheets"
  application/vnd.openxmlformats-officedocument.presentationml.presentation: "Presentations"
  # Images
  image/jpeg: "Photos"
  image/heic: "Photos"
  image/png: "Images"
  image/svg+xml: "Vector"
  # Archives
  application/zip: "Archives"
  application/x-tar: "Archives"
  application/gzip: "Archives"
  application/x-7z-compressed: "Archives"
  # Code
  text/x-python: "Python"
  text/x-c: "C"
  text/x-c++: "C++"
