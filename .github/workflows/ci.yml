name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # Hook environments are installed once, then reused until the config changes
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Same checks as the local git hook, but on every file
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # OIDC: GitHub proves to Codecov the upload comes from this repo, no token
    permissions:
      contents: read
      id-token: write
    env:
      # Makes Python warn about every file opened without encoding=, which
      # pyproject.toml turns into a test failure (see filterwarnings)
      PYTHONWARNDEFAULTENCODING: "1"
    strategy:
      # Run every version even if one fails, to see the whole picture
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # term: report in the log, xml: coverage.xml for Codecov
      - run: uv run --locked pytest --cov --cov-report=term --cov-report=xml
      # One upload is enough: coverage is the same on every Python version
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.14'
        with:
          use_oidc: true
