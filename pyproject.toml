[project]
name = "mimedy"
version = "1.1.0"
description = "Organize messy folders by real file type, detected from content with Google Magika"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Olivier Chapeau" }]
keywords = ["magika", "mime", "mimetype", "organizer", "files", "downloads", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "magika>=1.0.3",
    "pyyaml>=6.0.2",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/ochapeau/mimedy"
Repository = "https://github.com/ochapeau/mimedy"
Issues = "https://github.com/ochapeau/mimedy/issues"
Releases = "https://github.com/ochapeau/mimedy/releases"

[project.scripts]
mimedy = "mimedy.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports/variables, undefined names)
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modern syntax)
    "B",     # flake8-bugbear (likely bugs)
    "A",     # flake8-builtins (shadowing builtins)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "BLE",   # flake8-blind-except
    "TRY",   # tryceratops (exception handling)
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print (no print/pprint)
    "S",     # flake8-bandit (security)
    "ANN",   # flake8-annotations (type hints)
    "PL",    # pylint
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert and literal expected values
"tests/**" = ["S101", "PLR2004"]

[tool.coverage.run]
source = ["mimedy"]  # measure our package, not pytest or the tests
branch = true  # same as --cov-branch

[tool.coverage.report]
fail_under = 95  # the run fails below 95% (lines and branches together)
show_missing = true  # list the uncovered lines (Missing column)
skip_covered = true  # hide files at 100%
exclude_also = [
    'if __name__ == "__main__":',  # never runs under pytest
]
